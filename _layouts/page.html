---
layout: default
---
<article class="entry">
  <header class="entry-head band">
    {% if page.label %}<p class="label"><span>{{ page.label }}</span></p>{% endif %}
    <h1>{{ page.title }}</h1>
  </header>
  <div class="entry-body entry-body--page">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
